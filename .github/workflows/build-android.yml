name: Build & Release Android APK (ARM64)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tag versi rilis Android (contoh: v0.7.0-android.1)'
        required: true
        default: 'v0.7.0-android.1'
        type: string
      publish_release:
        description: 'Publikasikan langsung ke GitHub Releases'
        required: true
        default: 'true'
        type: string
      vulkan_mode:
        description: 'Mode Vulkan target'
        required: false
        default: '1.0-fallback'
        type: string
      min_sdk:
        description: 'Android minSdk'
        required: false
        default: '29'
        type: string
  push:
    tags:
      - 'v*-android*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK 27.2.12479018 & CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare APK Signing Keystore
        run: |
          mkdir -p /tmp/signing
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/signing/release.jks
            echo "ANDROID_KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore /tmp/signing/release.jks \
              -storepass genmarecomp \
              -keypass genmarecomp \
              -alias genma \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Genma Recomp Android, OU=Community Port, O=GenmaRecomp, L=ID, C=ID"
            echo "ANDROID_KEYSTORE_PASS=genmarecomp" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=genma" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASS=genmarecomp" >> $GITHUB_ENV
          fi
          echo "ANDROID_KEYSTORE_PATH=/tmp/signing/release.jks" >> $GITHUB_ENV

      - name: Build Signed Android ARM64 APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Package Release Assets & SHA-256 Checksums
        id: pkg
        run: |
          VERSION="${{ inputs.release_version || github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "android-port" || "$VERSION" == "main" ]]; then
            VERSION="v0.7.0-android.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p release-dist
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_OUT="release-dist/GenmaOnimusha-${VERSION}-android-arm64-v8a.apk"
          cp "$APK_SRC" "$APK_OUT"

          tar -czf "release-dist/GenmaOnimusha-${VERSION}-pc-android-builder.tar.gz" \
            tools/build_android_pc.sh \
            docs/android-port-guide.md \
            sdk/runtime/xdk/fiber_android.h \
            sdk/runtime/kernel/memory_android.cpp \
            sdk/runtime/cpu/arm64_compat.h \
            sdk/runtime/gpu/vulkan_android.h \
            sdk/runtime/core/touch_overlay.h \
            sdk/runtime/core/touch_overlay.cpp

          (cd release-dist && sha256sum * > SHA256SUMS)
          ls -lh release-dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genma-android-arm64-apk
          path: release-dist/*

      - name: Publish GitHub Release
        if: ${{ (inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: "Genma Onimusha Android ARM64 ${{ steps.pkg.outputs.version }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ### Genma Onimusha — Unofficial Android ARM64 Port (${{ steps.pkg.outputs.version }})

            > **Penting (Asset-Free Release)**: APK ini tidak menyertakan kode biner `default.xbe` maupun aset game asli Capcom. Gunakan salinan legal **Genma Onimusha (USA)** milik Anda melalui skrip PC cross-compile (`tools/build_android_pc.sh`).

            #### Spesifikasi Build
            - **Target Minimum**: Android 10+ (API 29+), ABI `arm64-v8a`
            - **Grafis**: Vulkan 1.0+ Fallback (Adreno/Mali) + SPIR-V pra-kompilasi
            - **Core ARM64**: Pengganti fiber Bionic ARM64 murni (`fiber_android.h`) & alias memori fisik 4 GiB (`syscall(SYS_memfd_create)` + `ASharedMemory`)
            - **Kontrol & UI**: Gamepad Bluetooth/USB-C + Overlay sentuh virtual + Menu ImGui ramah sentuh (1.45x DPI)
            - **HD Texture Pack**: Dukungan penyimpanan SAF dengan cache mobile 512 MB
          files: |
            release-dist/*.apk
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
