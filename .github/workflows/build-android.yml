name: Build & Release Android APK (ARM64)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tag versi rilis Android (contoh: v0.8.15-android)'
        required: true
        default: 'v0.8.15-android'
        type: string
      publish_release:
        description: 'Publikasikan langsung ke GitHub Releases'
        required: true
        default: 'true'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*-android*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Pinned Upstream rafaelkenedy/genma-recomp & Apply Android Patch
        run: |
          bash tools/sync_upstream.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK 27.2.12479018 & CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT tidak ditemukan pada runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Decrypt default.xbe & Recompile to C++20 (Black-Android Standalone Mode)
        id: recomp
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [[ ! -f "ci/default.xbe.enc" ]]; then
            echo "::error::ci/default.xbe.enc tidak ditemukan."
            exit 1
          fi
          if [[ -z "$XBE_KEY" ]]; then
            echo "::error::GitHub Actions Secret XBE_KEY belum diset."
            exit 1
          fi
          mkdir -p assets generated/game
          key_file="$RUNNER_TEMP/xbe.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$XBE_KEY" > "$key_file"
          chmod 600 "$key_file"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key_file"; then
            echo "::error::Gagal mendekripsi ci/default.xbe.enc. Pastikan nilai Secret XBE_KEY cocok."
            exit 1
          fi
          rm -f "$key_file"
          sha1sum assets/default.xbe

          sudo apt-get update && sudo apt-get install -y clang make ninja-build lld python3-pil
          cmake --preset linux-core
          cmake --build --preset linux-core --target xbe_recomp xbe_symbols --parallel "$(nproc)"
          ./out/build/linux-core/xbe_recomp config/game.toml --xdk sdk/xdk
          ls -la generated/game/x86_func_mapping.cpp generated/game/image_symbols.h
          echo "mode=standalone-libmain" >> "$GITHUB_OUTPUT"

      - name: Prepare APK Release Keystore (Optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASS=$ANDROID_KEYSTORE_PASS"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASS=$ANDROID_KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tidak diset; APK akan menggunakan debug keystore Android."
          fi

      - name: Resolve Version
        id: ver
        run: |
          VERSION="${{ inputs.release_version || github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "main" ]]; then
            VERSION="v0.8.15-android"
          fi
          CLEAN_NAME="${VERSION#v}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$CLEAN_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Android Launcher Icons (Adaptive + Legacy + Round)
        run: |
          python3 tools/generate_android_icons.py
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ic_launcher*.png

      - name: Build Android ARM64 APK (SDL3 + Vulkan + libmain.so)
        working-directory: android
        run: |
          gradle assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.ver.outputs.name }} \
            --stacktrace --no-daemon

      - name: Package Release Assets & SHA-256 Checksums
        run: |
          mkdir -p release-dist
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TAG="${{ steps.ver.outputs.tag }}"
          if [[ "$TAG" == *-android ]]; then
            APK_OUT="release-dist/GenmaOnimusha-${TAG}-arm64-v8a.apk"
          else
            APK_OUT="release-dist/GenmaOnimusha-${TAG}-android-arm64-v8a.apk"
          fi
          cp "$APK_SRC" "$APK_OUT"
          (cd release-dist && sha256sum * > SHA256SUMS)
          ls -lh release-dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genma-android-arm64-apk-${{ steps.ver.outputs.tag }}
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (inputs.publish_release == 'true') || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Genma Onimusha Android ARM64 ${{ steps.ver.outputs.tag }}"
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ### Genma Onimusha — Android ARM64 Port (${{ steps.ver.outputs.tag }})

            > **Catatan Pembaruan (`v0.8.15-android`)**: Perbaikan menyeluruh arsitektur **True Fullscreen Edge-to-Edge & 16:9 / No-Stretch Widescreen** di seluruh pipeline Android → SDL3 → Vulkan (`display_math.h`, `settings.cpp`, `vulkan.cpp`, `GenmaActivity`, `styles.xml`). Mode **4:3 Native**, **16:9 Widescreen (No-Stretch)**, dan **Fullscreen No-Stretch (Adaptive)** kini menjaga proporsi piksel **1:1 tanpa gepeng** di rasio layar apa pun (`16:9`, `18:9`, `19.5:9`, `20:9+`), mendukung *display cutout / notch*, 5 preset **Vertical Framing** (`Top 0%` / `HUD-Safe 25%` / `Center 50%` / `Subtitle-Safe 70%` / `Bottom 100%`), serta upscaling `0.75x–3x` bebas distorsi. Default instalasi baru tetap aman (`1x` Native 480p, `4:3`, V-Sync On, 60 FPS, Bilinear).

            - **Perbaikan Pipeline Display & Vulkan pada `v0.8.15-android`**:
              - **Zero-Stretch Presentation (`ComputePresentPlan`)**: Menghilangkan peregangan horizontal `+33%–67%` pada blit Vulkan; mode `16:9 Widescreen` dan `Fullscreen No-Stretch` mengisi layar lebar dengan piksel persegi 1:1 yang proporsional.
              - **True Immersive Cutout Fullscreen**: `windowLayoutInDisplayCutoutMode=shortEdges` / `LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS` + `setDecorFitsSystemWindows(false)` dan `hideSystemBars()` sejak `onCreate()` / `onResume()`, sehingga area *notch/punch-hole* terpakai penuh tanpa *letterbox* OS.
              - **Live Physical Swapchain & Display Detection (`ScreenMode` + `WindowPixels`)**: Menghapus inisialisasi `1280×720` statis dan cache `0×0` pada `Desktop()`/`Widescreen()`; `Vulkan::Resize()` membaca dimensi piksel aktual langsung dari window SDL3 secara *real-time*.
              - **5 Preset Vertical Framing Aktif**: `0% Top`, `25% HUD-Safe`, `50% Center`, `70% Subtitle-Safe`, dan `100% Bottom` menggeser jendela framing vertikal secara nyata pada mode `16:9` maupun `Fullscreen No-Stretch`.
              - **Diagnostik `[DISPLAY]` / `[RENDER]` / `[VULKAN]`** di `genma.log` & `logcat` + fallback GPU **Mali / Immortalis / Exynos** (`D32_SFLOAT_S8_UINT`, swapchain non-sRGB, decode DXT CPU, *WAW barrier*), kontrol sentuh & impor skin komunitas, controller *hot-plug* in-game, dan lokalisasi Bahasa Indonesia tetap utuh.
            - **Target Minimum**: Android 10+ (API 29+), ABI `arm64-v8a`, 16 KB page-aligned
          files: |
            release-dist/*.apk
            release-dist/SHA256SUMS
